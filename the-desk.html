<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

.desk-app {
  --wood-dark: #241f1a;
  --wood-mid: #332a22;
  --wood-line: rgba(0,0,0,0.18);
  --lamp: #e8a94d;
  --lamp-soft: rgba(232,169,77,0.30);
  --lamp-softer: rgba(232,169,77,0.14);
  --paper: #f5f0e4;
  --paper-dim: #e6dfcd;
  --paper-shadow: #cdc3a8;
  --ink: #2b2420;
  --ink-soft: #6b5f4f;
  --sage: #7a9683;
  --sage-deep: #4f6a58;
  --rust: #b5654b;

  font-family: 'Inter', sans-serif;
  color: var(--paper);
  background-color: var(--wood-dark);
  background-image:
    repeating-linear-gradient(90deg, var(--wood-line) 0px, var(--wood-line) 1px, transparent 1px, transparent 84px),
    linear-gradient(180deg, var(--wood-mid), var(--wood-dark) 70%);
  border-radius: 16px;
  padding: 40px 36px 28px;
  max-width: 640px;
  margin: 0 auto;
  box-sizing: border-box;
}
.desk-app * { box-sizing: border-box; }

.desk-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 8px;
}
.desk-eyebrow {
  display: block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--lamp);
  margin-bottom: 4px;
}
.desk-title h1 {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 30px;
  margin: 0;
  color: var(--paper);
}
.desk-date {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--ink-soft);
  filter: brightness(1.8);
}

.capture-row {
  display: flex;
  gap: 8px;
  margin-bottom: 30px;
}
#capture-input {
  flex: 1;
  background: rgba(0,0,0,0.22);
  border: 1px solid rgba(232,169,77,0.25);
  border-radius: 8px;
  padding: 13px 14px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: var(--paper);
  outline: none;
  transition: border-color 0.15s ease, background 0.15s ease;
}
#capture-input::placeholder { color: rgba(245,240,228,0.4); }
#capture-input:focus {
  border-color: var(--lamp);
  background: rgba(0,0,0,0.3);
}
#capture-btn {
  background: var(--lamp);
  color: #241f1a;
  border: none;
  border-radius: 8px;
  padding: 0 18px;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: filter 0.15s ease, transform 0.1s ease;
}
#capture-btn:hover { filter: brightness(1.1); }
#capture-btn:active { transform: scale(0.97); }

.desk-focus { margin-bottom: 34px; min-height: 108px; }

.focus-card {
  position: relative;
  background: var(--paper);
  color: var(--ink);
  border-radius: 6px;
  padding: 26px 28px 22px;
  box-shadow: 0 0 70px var(--lamp-soft), 0 22px 44px rgba(0,0,0,0.45);
  animation: settle 0.35s ease;
}
@keyframes settle {
  from { opacity: 0; transform: translateY(-8px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.focus-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.14em;
  color: var(--ink-soft);
  display: block;
  margin-bottom: 10px;
}
.focus-text {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 500;
  line-height: 1.35;
  margin: 0 0 20px;
  word-break: break-word;
}
.focus-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.btn {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  border: none;
  border-radius: 6px;
  padding: 9px 14px;
  cursor: pointer;
  transition: filter 0.15s ease, transform 0.1s ease;
}
.btn:active { transform: scale(0.96); }
.btn-done { background: var(--sage); color: #16221b; }
.btn-done:hover { filter: brightness(1.08); }
.btn-back { background: transparent; color: var(--ink-soft); border: 1px solid var(--paper-shadow); }
.btn-back:hover { background: rgba(0,0,0,0.05); }
.btn-timer { background: rgba(43,36,32,0.08); color: var(--ink); border: 1px solid var(--paper-shadow); }
.btn-timer:hover { background: rgba(43,36,32,0.14); }
.timer-display {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
  background: rgba(43,36,32,0.08);
  border-radius: 6px;
  padding: 8px 12px;
  min-width: 64px;
  text-align: center;
}
.timer-up {
  color: #7a3323;
  background: rgba(181,101,75,0.16);
}
.timer-note {
  font-size: 12.5px;
  color: var(--ink-soft);
  margin-top: 12px;
  width: 100%;
}

.focus-empty {
  border: 1px dashed rgba(232,169,77,0.35);
  border-radius: 6px;
  padding: 24px 26px;
  text-align: center;
  color: rgba(245,240,228,0.55);
  font-size: 14px;
}
.focus-empty strong { color: var(--paper); font-weight: 600; }

.tray-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
}
.tray-header h2 {
  font-family: 'Fraunces', serif;
  font-size: 15px;
  font-weight: 600;
  color: rgba(245,240,228,0.75);
  margin: 0;
  letter-spacing: 0.01em;
}
.tray-count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11.5px;
  color: var(--ink-soft);
  filter: brightness(1.8);
}
.tray-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
}
.tray-card {
  background: var(--paper-dim);
  color: var(--ink);
  border-radius: 4px;
  padding: 12px 13px 10px;
  font-size: 13px;
  line-height: 1.4;
  box-shadow: 0 6px 14px rgba(0,0,0,0.28);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  position: relative;
  animation: cardIn 0.3s ease;
}
.tray-card:nth-child(3n+1) { transform: rotate(-1deg); }
.tray-card:nth-child(3n+2) { transform: rotate(0.8deg); }
.tray-card:nth-child(3n)   { transform: rotate(-0.4deg); }
.tray-card:hover {
  transform: rotate(0deg) translateY(-2px);
  background: var(--paper);
  box-shadow: 0 10px 20px rgba(0,0,0,0.35);
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(-6px) rotate(0deg) scale(0.96); }
  to { opacity: 1; }
}
.tray-card-text { display: block; margin-bottom: 8px; word-break: break-word; }
.tray-card-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.tray-card-pull {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--sage-deep);
  font-weight: 500;
}
.tray-card-del {
  background: none;
  border: none;
  color: var(--rust);
  font-size: 14px;
  cursor: pointer;
  line-height: 1;
  padding: 2px 4px;
  opacity: 0.55;
}
.tray-card-del:hover { opacity: 1; }

.tray-empty {
  color: rgba(245,240,228,0.4);
  font-size: 13px;
  padding: 6px 2px 2px;
}

.desk-footer {
  margin-top: 30px;
  padding-top: 16px;
  border-top: 1px solid rgba(232,169,77,0.15);
  font-size: 12.5px;
  color: rgba(245,240,228,0.45);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
}
.desk-footer strong { color: rgba(245,240,228,0.7); font-weight: 600; }

@media (max-width: 480px) {
  .desk-app { padding: 26px 18px 20px; }
  .focus-text { font-size: 19px; }
}

@media (prefers-reduced-motion: reduce) {
  .focus-card, .tray-card { animation: none !important; }
}
</style>

<div class="desk-app">
  <div class="desk-header">
    <div class="desk-title">
      <span class="desk-eyebrow">ONE THING AT A TIME</span>
      <h1>The Desk</h1>
    </div>
    <div class="desk-date" id="desk-date"></div>
  </div>

  <div class="capture-row">
    <input id="capture-input" type="text" maxlength="200" placeholder="Capture whatever just crossed your mind…" />
    <button id="capture-btn">File it</button>
  </div>

  <div class="desk-focus" id="desk-focus"></div>

  <div class="desk-tray">
    <div class="tray-header">
      <h2>In the tray</h2>
      <span class="tray-count" id="tray-count"></span>
    </div>
    <div class="tray-list" id="tray-list"></div>
  </div>

  <div class="desk-footer" id="desk-footer"></div>
</div>

<script>
(function() {
  const STORAGE_KEY = 'desk-tracker-state';
  let state = { tasks: [] };
  let timerInterval = null;

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function todayStr() {
    return new Date().toDateString();
  }

  function genId() {
    return 'card-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
  }

  async function loadState() {
    try {
      const result = await window.storage.get(STORAGE_KEY, false);
      if (result && result.value) {
        const parsed = JSON.parse(result.value);
        if (parsed && Array.isArray(parsed.tasks)) {
          state = parsed;
        }
      }
    } catch (e) {
      state = { tasks: [] };
    }
    pruneOldDone();
    render();
  }

  async function saveState() {
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    } catch (e) {
      // Storage failed silently; state still lives in memory for this session.
    }
  }

  function pruneOldDone() {
    const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
    state.tasks = state.tasks.filter(t => t.status !== 'done' || (t.doneAt && t.doneAt > cutoff));
  }

  function getDesk() {
    return state.tasks.find(t => t.status === 'desk') || null;
  }
  function getTray() {
    return state.tasks.filter(t => t.status === 'tray').sort((a, b) => b.createdAt - a.createdAt);
  }
  function getDoneToday() {
    const today = todayStr();
    return state.tasks.filter(t => t.status === 'done' && t.doneAtStr === today);
  }

  function addTask(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    state.tasks.push({
      id: genId(),
      text: trimmed,
      status: 'tray',
      createdAt: Date.now(),
      timerEndsAt: null,
      timerUp: false
    });
    saveState();
    render();
  }

  function moveToDesk(id) {
    const current = getDesk();
    if (current) {
      current.status = 'tray';
      current.timerEndsAt = null;
      current.timerUp = false;
    }
    const target = state.tasks.find(t => t.id === id);
    if (target) target.status = 'desk';
    saveState();
    render();
  }

  function moveToTray(id) {
    const task = state.tasks.find(t => t.id === id);
    if (task) {
      task.status = 'tray';
      task.timerEndsAt = null;
      task.timerUp = false;
    }
    saveState();
    render();
  }

  function completeTask(id) {
    const task = state.tasks.find(t => t.id === id);
    if (task) {
      task.status = 'done';
      task.doneAt = Date.now();
      task.doneAtStr = todayStr();
      task.timerEndsAt = null;
      task.timerUp = false;
    }
    saveState();
    render();
  }

  function deleteTask(id) {
    state.tasks = state.tasks.filter(t => t.id !== id);
    saveState();
    render();
  }

  function startTimer(id, minutes) {
    const task = state.tasks.find(t => t.id === id);
    if (task) {
      task.timerEndsAt = Date.now() + minutes * 60 * 1000;
      task.timerUp = false;
    }
    saveState();
    render();
  }

  function extendTimer(id, minutes) {
    const task = state.tasks.find(t => t.id === id);
    if (task) {
      task.timerEndsAt = Date.now() + minutes * 60 * 1000;
      task.timerUp = false;
    }
    saveState();
    render();
  }

  function stopTimer(id) {
    const task = state.tasks.find(t => t.id === id);
    if (task) {
      task.timerEndsAt = null;
      task.timerUp = false;
    }
    saveState();
    render();
  }

  function formatMMSS(ms) {
    const totalSec = Math.max(0, Math.round(ms / 1000));
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function renderDate() {
    const el = document.getElementById('desk-date');
    el.textContent = new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function renderFocus() {
    const container = document.getElementById('desk-focus');
    const desk = getDesk();

    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

    if (!desk) {
      const trayCount = getTray().length;
      container.innerHTML = trayCount > 0
        ? '<div class="focus-empty">The desk is clear. <strong>Pull one card from the tray</strong> below, and let the rest wait — they\\'re safely filed.</div>'
        : '<div class="focus-empty">Nothing waiting, nothing on the desk. <strong>Capture what\\'s on your mind</strong>, or enjoy the quiet.</div>';
      return;
    }

    let timerHtml = '';
    if (desk.timerEndsAt) {
      const remaining = desk.timerEndsAt - Date.now();
      if (remaining <= 0) {
        timerHtml = `
          <span class="timer-display timer-up">Time's up</span>
          <button class="btn btn-timer" data-action="extend" data-id="${desk.id}">+10 min</button>
          <div class="timer-note">Keep going, or wrap it up and move on.</div>`;
      } else {
        timerHtml = `
          <span class="timer-display" id="timer-live">${formatMMSS(remaining)}</span>
          <button class="btn btn-back" data-action="stop-timer" data-id="${desk.id}">Stop timer</button>`;
      }
    } else {
      timerHtml = `
        <button class="btn btn-timer" data-action="timer" data-minutes="15" data-id="${desk.id}">15 min</button>
        <button class="btn btn-timer" data-action="timer" data-minutes="25" data-id="${desk.id}">25 min</button>
        <button class="btn btn-timer" data-action="timer" data-minutes="45" data-id="${desk.id}">45 min</button>`;
    }

    container.innerHTML = `
      <div class="focus-card">
        <span class="focus-label">ON THE DESK</span>
        <p class="focus-text">${escapeHtml(desk.text)}</p>
        <div class="focus-actions">
          <button class="btn btn-done" data-action="done" data-id="${desk.id}">Done ✓</button>
          <button class="btn btn-back" data-action="back" data-id="${desk.id}">Back to tray</button>
          ${timerHtml}
        </div>
      </div>`;

    if (desk.timerEndsAt && desk.timerEndsAt - Date.now() > 0) {
      timerInterval = setInterval(() => {
        const remaining = desk.timerEndsAt - Date.now();
        const live = document.getElementById('timer-live');
        if (remaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          renderFocus();
        } else if (live) {
          live.textContent = formatMMSS(remaining);
        }
      }, 1000);
    }
  }

  function renderTray() {
    const list = document.getElementById('tray-list');
    const countEl = document.getElementById('tray-count');
    const tray = getTray();
    countEl.textContent = tray.length + (tray.length === 1 ? ' waiting' : ' waiting');

    if (tray.length === 0) {
      list.innerHTML = '<div class="tray-empty">Tray\\'s clear.</div>';
      return;
    }

    list.innerHTML = tray.map(t => `
      <div class="tray-card" data-action="pull" data-id="${t.id}">
        <span class="tray-card-text">${escapeHtml(t.text)}</span>
        <div class="tray-card-row">
          <span class="tray-card-pull">MOVE TO DESK →</span>
          <button class="tray-card-del" data-action="delete" data-id="${t.id}" title="Remove">✕</button>
        </div>
      </div>
    `).join('');
  }

  function renderFooter() {
    const footer = document.getElementById('desk-footer');
    const doneToday = getDoneToday().length;
    const trayCount = getTray().length;
    footer.innerHTML = `
      <span><strong>${doneToday}</strong> done today</span>
      <span>${trayCount === 0 ? 'nothing else waiting' : 'everything else is filed, not forgotten'}</span>
    `;
  }

  function render() {
    renderDate();
    renderFocus();
    renderTray();
    renderFooter();
  }

  // Event delegation for dynamically rendered buttons/cards
  document.addEventListener('click', function(e) {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.getAttribute('data-action');
    const id = target.getAttribute('data-id');

    if (action === 'pull') { moveToDesk(id); }
    else if (action === 'delete') { e.stopPropagation(); deleteTask(id); }
    else if (action === 'done') { completeTask(id); }
    else if (action === 'back') { moveToTray(id); }
    else if (action === 'timer') { startTimer(id, parseInt(target.getAttribute('data-minutes'), 10)); }
    else if (action === 'extend') { extendTimer(id, 10); }
    else if (action === 'stop-timer') { stopTimer(id); }
  });

  const input = document.getElementById('capture-input');
  const captureBtn = document.getElementById('capture-btn');

  function submitCapture() {
    addTask(input.value);
    input.value = '';
    input.focus();
  }

  captureBtn.addEventListener('click', submitCapture);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') submitCapture();
  });

  loadState();
})();
</script>
